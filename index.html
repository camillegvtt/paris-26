header{text-align:center;padding:30px 18px 8px}
header svg{width:74px;height:auto;stroke:var(--deep);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:'Playfair Display',Georgia,serif;font-size:1.9rem;letter-spacing:.2em;margin:4px 0 0 .2em;color:var(--deep);font-weight:600}
.sub{color:var(--gold);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;margin-top:4px}
.sub::before,.sub::after{content:"✦";margin:0 10px;color:var(--pink)}
.bar{max-width:520px;margin:16px auto 0;background:var(--card);border:1px solid var(--pink);border-radius:99px;height:12px;padding:2px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(45deg,var(--deep) 0 8px,var(--pink) 8px 16px);transition:width .4s}
.cnt{font-size:.8rem;color:var(--soft);margin-top:6px}
main{max-width:640px;margin:0 auto;padding:10px 14px 30px}
.day{background:var(--card);background:color-mix(in srgb,var(--card) 78%,transparent);border-radius:6px 6px 22px 22px;margin:22px 0;box-shadow:0 8px 22px rgba(229,138,165,.18);overflow:hidden;border:1px solid var(--line)}
.day::before{content:"";display:block;height:18px;background:repeating-linear-gradient(90deg,var(--pink) 0 24px,var(--card) 24px 48px);border-radius:0 0 14px 14px;border-bottom:1px solid var(--pink)}
.day h2{margin:14px auto 6px;width:fit-content;max-width:92%;padding:6px 20px;border:2px solid var(--deep);border-radius:8px;box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--pink);font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;color:var(--deep);text-align:center;cursor:pointer}
.day h2 small{display:block;font-family:'Poppins',sans-serif;letter-spacing:.05em;font-size:.68rem;color:var(--soft);text-transform:none;font-weight:400}
.day.shut ul{display:none}
ul{list-style:none;margin:0;padding:6px 0 10px}
li{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;cursor:pointer;border-top:1px dashed var(--line)}
li:first-child{border-top:0}
input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border:2px solid var(--pink);border-radius:50%;margin:2px 0 0;background:var(--card);cursor:pointer;display:grid;place-content:center}
input:checked{background:var(--deep);border-color:var(--deep)}
input:checked::after{content:"✓";color:#fff;font-size:13px;line-height:1}
.t{flex:none;width:82px;font-size:.78rem!important;font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--gold);font-size:.92rem;padding-top:1px}
.b{flex:1;min-width:0}
.day h2 em{display:block;font-family:'Poppins',sans-serif;font-style:normal;font-weight:400;letter-spacing:.12em;font-size:.62rem;color:var(--gold);margin-top:2px}
li.h{cursor:default;padding:10px 16px 2px;font-family:'Playfair Display',Georgia,serif;font-style:italic;color:var(--deep);font-size:.9rem;border-top:1px dashed var(--line)}
li.done .l{text-decoration:line-through;opacity:.5}
.tag{display:inline-block;font-size:.68rem;padding:1px 10px;border-radius:99px;margin-top:3px}
.tag.r{background:var(--deep);color:#fff}
.tag.w{background:var(--warn);color:var(--warnt);border:1px dashed var(--gold)}
.note{display:block;font-size:.78rem;color:var(--warnt);margin-top:2px}
footer{text-align:center;color:var(--pink);letter-spacing:.4em;font-size:.8rem;padding-bottom:12px}
button{display:block;margin:0 auto 10px;border:1px solid var(--pink);background:var(--card);color:var(--deep);padding:8px 18px;border-radius:99px;font:inherit;font-size:.8rem;cursor:pointer}
</style>
</head>

<button onclick="resetAll()">Tout décocher</button>
<footer>✦ ✦ ✦</footer>
<script>
// statut : r = réservé, n = non réservé, a = à réserver le jour même, w = attention
const D=[

const TAGS={r:["✓ Réservé","r"],a:["⏳ À réserver le jour même","w"],w:["⚠️ Tentative sur place","w"]};
const K="paris-2026-v2";
let S={};
try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){S={}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function build(){
const m=document.getElementById("m");
m.innerHTML=D.map((d,i)=>`<section class="day" id="d${i}"><h2 onclick="this.parentNode.classList.toggle('shut')">${d[0]}<em>${d[2]}</em><small></small></h2><ul>`+
d[1].map((a,j)=>{if(a[0]==="#")return `<li class="h">${a[1]}</li>`;const k=i+"-"+j,tg=TAGS[a[2]]||null;
return `<li data-k="${k}"><input type="checkbox"><span class="t">${a[0]}</span><span class="b"><span class="l">${a[1]}</span>${tg?`<br><span class="tag ${tg[1]}">${tg[0]}</span>`:""}${a[3]?`<span class="note">${a[3]}</span>`:""}</span></li>`}).join("")+`</ul></section>`).join("");
m.querySelectorAll("li[data-k]").forEach(li=>{
const cb=li.querySelector("input"),k=li.dataset.k;

function upd(){

D.forEach((d,i)=>{let n=0,c=0;d[1].forEach((a,j)=>{if(a[0]==="#")return;c++;if(S[i+"-"+j])n++});tot+=c;dn+=n;

document.getElementById("p").style.width=(dn/tot*100)+"%";
document.getElementById("c").textContent=dn+" sur "+tot+" étapes faites"+(dn===tot?" 🎉":"")}
